<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Online Shop</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cloudinary Upload Widget Library -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <h1>Real-Time Online Store</h1>
        
        <div class="admin-panel">
            <h3>Add New Product</h3>
            <input type="text" id="productName" placeholder="Product Name" /><br><br>
            <input type="text" id="productPrice" placeholder="Price ($)" /><br><br>
            <button id="upload_widget" class="cloudinary-button">Upload Image via Cloudinary</button>
            <p id="imageStatus">No image uploaded yet.</p>
            <button onclick="addProduct()" id="submitBtn" disabled>Add Product to Store</button>
        </div>

        <h2>Available Products</h2>
        <div id="product-list" class="product-grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
