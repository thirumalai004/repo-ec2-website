<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EC2 Frontend + Backend Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #222;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      padding: 10px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <h1>EC2 Frontend + Backend Demo</h1>
  <p>This page calls your Node.js backend through IIS's reverse proxy.</p>

  <button onclick="callBackend()">Call Backend API</button>
  <div id="result">Click the button to test the API.</div>
  <div class="status" id="status"></div>

  <script>
    async function callBackend() {
      const resultDiv = document.getElementById('result');
      const statusDiv = document.getElementById('status');
      resultDiv.textContent = 'Loading...';
      statusDiv.textContent = '';
      statusDiv.className = 'status';

      try {
        const response = await fetch('/api/hello');
        if (!response.ok) {
          throw new Error(`Server responded with status ${response.status}`);
        }
        const data = await response.json();
        resultDiv.textContent = data.message;
        statusDiv.textContent = 'Success — backend reached via /api/hello';
      } catch (err) {
        resultDiv.textContent = 'Failed to reach backend.';
        statusDiv.textContent = 'Error: ' + err.message;
        statusDiv.className = 'status error';
      }
    }

    // Auto-call on page load so you can verify immediately
    window.addEventListener('DOMContentLoaded', callBackend);
  </script>
</body>
</html>
