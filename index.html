<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save a Message</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #222; }
    input { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .status { font-size: 14px; margin-top: 12px; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Save a message</h1>
  <p>Type something and click Save — it's stored as a file on the server. Nothing is shown back here.</p>

  <input type="text" id="msgInput" placeholder="Type a message...">
  <button onclick="saveMessage()">Save</button>
  <div class="status" id="status"></div>

  <script>
    async function saveMessage() {
      const input = document.getElementById('msgInput');
      const statusDiv = document.getElementById('status');
      const text = input.value.trim();

      if (!text) {
        statusDiv.textContent = 'Type something first.';
        statusDiv.className = 'status error';
        return;
      }

      try {
        const response = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!response.ok) throw new Error(`Status ${response.status}`);

        input.value = '';
        statusDiv.textContent = 'Message saved.';
        statusDiv.className = 'status success';
      } catch (err) {
        statusDiv.textContent = 'Error saving message: ' + err.message;
        statusDiv.className = 'status error';
      }
    }
  </script>
</body>
</html>
