<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop a Note</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e293b, #0f172a); }
    .card { background: #fff; width: 100%; max-width: 420px; padding: 40px 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); text-align: center; }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 6px; color: #0f172a; }
    p { font-size: 13px; color: #64748b; margin: 0 0 24px; }
    textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; }
    textarea:focus { border-color: #6366f1; }
    button { width: 100%; margin-top: 16px; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4f46e5; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    .link { display: block; margin-top: 18px; font-size: 12px; color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✉️</div>
    <h1>Drop a note V2</h1>
    <p>Write a sms something below. It's saved to the database.</p>
    <textarea id="msgInput" placeholder="What's on your mind?"></textarea>
    <button id="saveBtn" onclick="saveMessage()">Save note</button>
    <div class="status" id="status"></div>
    <a class="link" href="/view.html">View saved messages →</a>
  </div>
  <script>
    async function saveMessage() {
      const input = document.getElementById('msgInput');
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('saveBtn');
      const text = input.value.trim();
      if (!text) {
        statusDiv.textContent = 'Write something first.';
        statusDiv.className = 'status error';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const response = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!response.ok) throw new Error(`Status ${response.status}`);
        input.value = '';
        statusDiv.textContent = 'Saved.';
        statusDiv.className = 'status success';
      } catch (err) {
        statusDiv.textContent = 'Error: ' + err.message;
        statusDiv.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save note';
      }
    }
  </script>
</body>
</html>
