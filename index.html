<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Web Page V2</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f5f5f5;
    color: #222;
  }
  h1 {
    text-align: center;
  }
  .top-bar {
    display: flex;
    justify-content: flex-end;
    max-width: 900px;
    margin: 0 auto 10px;
  }
  .link-btn {
    background: none;
    border: none;
    color: #2d6cdf;
    cursor: pointer;
    font-size: 14px;
    text-decoration: underline;
    padding: 4px 8px;
  }
  .link-btn:hover {
    color: #1f56b8;
  }
  .upload-box {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    margin-bottom: 30px;
  }
  input[type="file"], input[type="password"] {
    margin-right: 10px;
    padding: 6px;
  }
  button {
    background: #2d6cdf;
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #1f56b8;
  }
  button:disabled {
    background: #999;
    cursor: not-allowed;
  }
  #status, #loginStatus {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
  }
  #gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
  }
  .thumb-wrap {
    position: relative;
  }
  #gallery img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: block;
  }
  .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    padding: 0;
    font-size: 12px;
    cursor: pointer;
  }
  .hidden {
    display: none !important;
  }
  .login-box {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 320px;
    margin: 60px auto;
  }
  .badge {
    display: inline-block;
    background: #e8f0fe;
    color: #2d6cdf;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>

  <!-- ===================== PUBLIC VIEW ===================== -->
  <div id="publicView">
    <div class="top-bar">
      <button class="link-btn" onclick="goToAdmin()">Admin</button>
    </div>

    <h1>My Web Page V2</h1>

    <div id="publicGallery" class="gallery"></div>
  </div>

  <!-- ===================== ADMIN LOGIN ===================== -->
  <div id="adminLogin" class="hidden">
    <div class="login-box">
      <h2>Admin Login</h2>
      <input type="password" id="adminPassword" placeholder="Enter password">
      <br><br>
      <button onclick="checkAdminLogin()">Login</button>
      <button class="link-btn" onclick="goToPublic()">Back to gallery</button>
      <div id="loginStatus"></div>
    </div>
  </div>

  <!-- ===================== ADMIN PANEL ===================== -->
  <div id="adminPanel" class="hidden">
    <div class="top-bar">
      <button class="link-btn" onclick="logoutAdmin()">Logout</button>
    </div>

    <h1>Admin Panel <span class="badge">Admin</span></h1>

    <div class="upload-box">
      <input type="file" id="fileInput" accept="image/*">
      <button id="uploadBtn" onclick="uploadFile()">Add</button>
      <div id="status"></div>
    </div>

    <div id="gallery"></div>
  </div>

  <script>
    // ---- Your Cloudinary details ----
    const CLOUD_NAME = 'uws1nhjc';
    const UPLOAD_PRESET = 'LoGitWebCloud';
    const CLOUDINARY_FOLDER = 'website-uploads'; // organizes uploads into a folder in your Cloudinary account
    // ----------------------------------

    // ---- Admin password (change this to your own) ----
    const ADMIN_PASSWORD = 'admin123';
    // ----------------------------------------------------

    const STORAGE_KEY = 'galleryImages';
    const SESSION_KEY = 'isAdminLoggedIn';

    // ---------- View switching ----------
    function showView(viewId) {
      ['publicView', 'adminLogin', 'adminPanel'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', id !== viewId);
      });
    }

    function goToAdmin() {
      if (sessionStorage.getItem(SESSION_KEY) === 'true') {
        showView('adminPanel');
        renderGallery('gallery', true);
      } else {
        showView('adminLogin');
      }
      window.location.hash = 'admin';
    }

    function goToPublic() {
      showView('publicView');
      renderGallery('publicGallery', false);
      window.location.hash = '';
    }

    function checkAdminLogin() {
      const entered = document.getElementById('adminPassword').value;
      const loginStatus = document.getElementById('loginStatus');
      if (entered === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, 'true');
        document.getElementById('adminPassword').value = '';
        loginStatus.textContent = '';
        showView('adminPanel');
        renderGallery('gallery', true);
      } else {
        loginStatus.textContent = 'Incorrect password.';
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem(SESSION_KEY);
      goToPublic();
    }

    // ---------- Storage helpers ----------
    function getSavedImages() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveImage(item) {
      const images = getSavedImages();
      images.push(item);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
    }

    function removeSavedImage(publicId) {
      const images = getSavedImages().filter(img => img.publicId !== publicId);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
    }

    // ---------- Rendering ----------
    function renderGallery(containerId, editable) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      getSavedImages().forEach(item => {
        addImageToGallery(containerId, item.url, item.name, item.publicId, false, editable);
      });
    }

    function addImageToGallery(containerId, url, name, publicId, isNew, editable) {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';

      const img = document.createElement('img');
      img.src = url;
      img.alt = name;
      wrap.appendChild(img);

      if (editable) {
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove from gallery';
        removeBtn.onclick = () => {
          wrap.remove();
          removeSavedImage(publicId);
        };
        wrap.appendChild(removeBtn);
      }

      const container = document.getElementById(containerId);
      if (isNew) {
        container.prepend(wrap);
      } else {
        container.appendChild(wrap);
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const statusEl = document.getElementById('status');
      const uploadBtn = document.getElementById('uploadBtn');
      const file = fileInput.files[0];

      if (!file) {
        statusEl.textContent = 'Please select a file first.';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      formData.append('folder', CLOUDINARY_FOLDER);

      uploadBtn.disabled = true;
      statusEl.textContent = 'Uploading...';

      try {
        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
          { method: 'POST', body: formData }
        );

        if (!response.ok) {
          throw new Error(`Upload failed with status ${response.status}`);
        }

        const data = await response.json();

        addImageToGallery('gallery', data.secure_url, file.name, data.public_id, true, true);
        saveImage({ url: data.secure_url, name: file.name, publicId: data.public_id });

        statusEl.textContent = 'Upload successful!';
        fileInput.value = '';
      } catch (error) {
        console.error('Upload failed:', error);
        statusEl.textContent = 'Upload failed. Check console for details.';
      } finally {
        uploadBtn.disabled = false;
      }
    }

    // ---------- Init ----------
    document.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash === '#admin') {
        goToAdmin();
      } else {
        goToPublic();
      }
    });
  </script>

</body>
</html>
